# Use software volume, so the volume control scales the treble and bass paths
# together. The hardware levels that set their balance then stay fixed.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.pci-0000_00_1f.3.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
